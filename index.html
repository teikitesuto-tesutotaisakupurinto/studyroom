<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StudyRoom</title>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>

<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, "Noto Sans JP", sans-serif;
  background: #f3f6fb;
  color: #243247;
}
header {
  height: 62px;
  background: #fff;
  border-bottom: 1px solid #dce3ed;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
}
header h1 { font-size: 20px; margin: 0; }
main { max-width: 1100px; margin: 24px auto; padding: 0 16px; }
.panel {
  background: white;
  border: 1px solid #dce3ed;
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 16px;
}
input, button {
  font: inherit;
  border-radius: 8px;
  padding: 11px 14px;
}
input { border: 1px solid #bdc8d8; width: 100%; }
button {
  cursor: pointer;
  border: 0;
  background: #2563eb;
  color: white;
  font-weight: 600;
}
button:disabled { opacity: .55; cursor: wait; }
button.secondary { background: #64748b; }
#loginScreen { max-width: 440px; margin: 70px auto; }
#loginScreen button { width: 100%; margin-top: 12px; }
#app { display: none; }
#status {
  padding: 12px 14px;
  border-radius: 8px;
  background: #e8f1ff;
  color: #1d4f91;
  margin-bottom: 16px;
  overflow-wrap: anywhere;
}
#status.error { background: #fff0f0; color: #a32121; }
#status.ok { background: #e8f8ef; color: #17663b; }
.room-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 250px;
  gap: 16px;
}
#roomCanvas {
  display: block;
  width: 100%;
  aspect-ratio: 16 / 10;
  background: #f8fafc;
  border: 1px solid #d5deea;
  border-radius: 8px;
  touch-action: manipulation;
}
#playersList { padding-left: 20px; overflow-wrap: anywhere; }
#playersList li { margin: 10px 0; }
.small { color: #65748a; font-size: 13px; line-height: 1.7; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
@media (max-width: 720px) {
  .room-layout { grid-template-columns: 1fr; }
  header { padding: 0 12px; }
  main { margin-top: 14px; }
}
</style>
</head>

<body>
<header>
  <h1>StudyRoom</h1>
  <button id="leaveButton" class="secondary" style="display:none">退室する</button>
</header>

<section id="loginScreen" class="panel">
  <h2>StudyRoomに入室</h2>
  <p class="small">名前を入力して、同じ学習ルームに参加します。</p>
  <input id="nameInput" maxlength="20" placeholder="表示する名前">
  <button id="joinButton">入室する</button>
  <p id="loginMessage" class="small" role="status">Firebaseに接続する準備ができています。</p>
</section>

<main id="app">
  <div id="status" role="status">接続状態を確認しています。</div>
  <div class="room-layout">
    <section class="panel">
      <h2 style="margin-top:0">学習ルーム</h2>
      <p class="small">部屋の中をクリックすると、その位置へ移動します。矢印キーやW・A・S・Dでも移動できます。</p>
      <canvas id="roomCanvas" width="800" height="500"></canvas>
      <div class="controls">
        <button id="upButton" class="secondary">上へ</button>
        <button id="downButton" class="secondary">下へ</button>
        <button id="leftButton" class="secondary">左へ</button>
        <button id="rightButton" class="secondary">右へ</button>
      </div>
    </section>
    <aside class="panel">
      <h2 style="margin-top:0">参加者</h2>
      <p id="playerCount" class="small">参加者を読み込んでいます。</p>
      <ul id="playersList"></ul>
      <p class="small">参加者の位置はFirebase Realtime Databaseを通して共有されます。</p>
    </aside>
  </div>
</main>

<script>
"use strict";

/* Firebase Consoleで取得した設定 */
const firebaseConfig = {
  apiKey: "AIzaSyAXliKkcuGSFUvYmfxMfiY6SgYWdos2RKg",
  authDomain: "reservelink-efb43.firebaseapp.com",
  databaseURL: "https://reservelink-efb43-default-rtdb.firebaseio.com",
  projectId: "reservelink-efb43",
  storageBucket: "reservelink-efb43.firebasestorage.app",
  messagingSenderId: "134662112302",
  appId: "1:134662112302:web:9cf6ceb06c2eadb44e0bbf"
};

const $ = id => document.getElementById(id);
const loginScreen = $("loginScreen");
const appScreen = $("app");
const loginButton = $("joinButton");
const loginMessage = $("loginMessage");
const statusBox = $("status");
const canvas = $("roomCanvas");
const ctx = canvas.getContext("2d");

let auth;
let db;
let currentUser = null;
let myPlayerRef = null;
let playersRef = null;
let connectedRef = null;
let connectedCallback = null;
let playersCallback = null;
let joined = false;
let moving = false;
let writeTimer = null;
let lastWriteAt = 0;
let myName = "";
let myColor = "#2563eb";
let players = {};
let lastError = "";
let lastPositionWrite = Promise.resolve();

const COLORS = [
  "#2563eb", "#db2777", "#059669", "#9333ea",
  "#ea580c", "#0891b2", "#4f46e5", "#be123c"
];

try {
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  auth = firebase.auth();
  db = firebase.database();
  setStatus("Firebaseを初期化しました。入室できます。", "ok");
} catch (error) {
  loginMessage.textContent = "Firebase初期化エラー: " + error.message;
  loginButton.disabled = true;
}

function setStatus(message, type = "") {
  statusBox.textContent = message;
  statusBox.className = type;
}

function setLoginMessage(message) {
  loginMessage.textContent = message;
}

function errorText(error) {
  const code = error && error.code ? error.code : "unknown";
  const message = error && error.message ? error.message : String(error);
  return code + ": " + message;
}

function showError(where, error) {
  lastError = where + " — " + errorText(error);
  console.error(lastError, error);
  if (joined) {
    setStatus("同期エラー: " + lastError, "error");
  } else {
    setLoginMessage("エラー: " + lastError);
  }
}

function makeInitialPosition() {
  return {
    x: 100 + Math.random() * 600,
    y: 100 + Math.random() * 300
  };
}

function safeNumber(value, fallback) {
  const n = Number(value);
  return Number.isFinite(n) ? n : fallback;
}

function clampPosition(x, y) {
  return {
    x: Math.max(22, Math.min(canvas.width - 22, x)),
    y: Math.max(36, Math.min(canvas.height - 22, y))
  };
}

async function joinRoom() {
  if (!auth || !db) {
    setLoginMessage("Firebaseを初期化できません。設定を確認してください。");
    return;
  }
  if (joined) return;

  myName = $("nameInput").value.trim();
  if (!myName) {
    setLoginMessage("名前を入力してください。");
    $("nameInput").focus();
    return;
  }

  loginButton.disabled = true;
  setLoginMessage("Firebaseにログインしています…");

  try {
    if (!auth.currentUser) {
      await auth.signInAnonymously();
    }

    currentUser = auth.currentUser;
    if (!currentUser || !currentUser.uid) {
      throw new Error("ログイン後のユーザーIDを取得できませんでした。");
    }

    // すべての端末が同じパスを使うことが重要
    playersRef = db.ref("rooms/main/players");
    myPlayerRef = playersRef.child(currentUser.uid);
    connectedRef = db.ref(".info/connected");

    const initial = makeInitialPosition();
    myColor = COLORS[Math.floor(Math.random() * COLORS.length)];

    // 接続が切れた場合にサーバー側で自分の参加データを削除
    await myPlayerRef.onDisconnect().remove();

    // 既存データを読んでから、自分のデータを登録
    const snapshot = await myPlayerRef.once("value");
    const existing = snapshot.val() || {};

    const position = clampPosition(
      safeNumber(existing.x, initial.x),
      safeNumber(existing.y, initial.y)
    );

    await myPlayerRef.set({
      uid: currentUser.uid,
      name: myName,
      x: position.x,
      y: position.y,
      color: existing.color || myColor,
      zone: "main",
      updatedAt: firebase.database.ServerValue.TIMESTAMP
    });

    joined = true;
    loginScreen.style.display = "none";
    appScreen.style.display = "block";
    $("leaveButton").style.display = "inline-block";

    setStatus("入室しました。ほかの端末との同期を確認しています…");

    // 接続状態を監視。切断・再接続を画面に表示
    connectedCallback = snapshot => {
      const online = snapshot.val() === true;
      if (online) {
        setStatus("Firebase接続中。参加者の位置を同期しています。", "ok");
        // 再接続後に自分のデータが消えていた場合は再登録
        ensureOwnPlayer().catch(error => showError("再接続時の再登録", error));
      } else {
        setStatus("Firebaseとの接続が切れています。再接続を待っています。", "error");
      }
    };
    connectedRef.on("value", connectedCallback, error => showError("接続状態の受信", error));

    // このイベントで全員の参加・退室・移動を受信する
    playersCallback = snapshot => {
      players = snapshot.val() || {};
      renderPlayers();
      drawRoom();
      $("playerCount").textContent = "参加者：" + Object.keys(players).length + "人";

      if (currentUser && players[currentUser.uid]) {
        const me = players[currentUser.uid];
        if (me.name !== myName) {
          console.warn("自分の参加データの名前が異なっています。");
        }
      }
    };
    playersRef.on("value", playersCallback, error => showError("参加者データの受信", error));

    // 最初の参加者一覧が受信されたかを画面に出す
    setStatus("入室済み。同期データを受信しています。", "ok");

  } catch (error) {
    showError("入室処理", error);
    try {
      if (myPlayerRef) await myPlayerRef.onDisconnect().cancel();
    } catch (_) {}
    joined = false;
    loginButton.disabled = false;
  }
}

async function ensureOwnPlayer() {
  if (!joined || !myPlayerRef || !currentUser) return;

  const snapshot = await myPlayerRef.once("value");
  if (snapshot.exists()) return;

  const pos = makeInitialPosition();
  await myPlayerRef.set({
    uid: currentUser.uid,
    name: myName,
    x: pos.x,
    y: pos.y,
    color: myColor,
    zone: "main",
    updatedAt: firebase.database.ServerValue.TIMESTAMP
  });
}

function queuePositionWrite() {
  if (!joined || !myPlayerRef || !currentUser) return;

  // 描画は即時、通信は最大約15回/秒に制限
  if (writeTimer) return;
  const delay = Math.max(0, 66 - (Date.now() - lastWriteAt));

  writeTimer = setTimeout(() => {
    writeTimer = null;
    lastWriteAt = Date.now();

    const me = players[currentUser.uid] || {};
    const position = {
      x: safeNumber(me.x, 100),
      y: safeNumber(me.y, 100)
    };

    // 連続更新が競合しないよう、書き込みを順番に実行
    lastPositionWrite = lastPositionWrite
      .catch(() => {})
      .then(() => myPlayerRef.update({
        x: position.x,
        y: position.y,
        updatedAt: firebase.database.ServerValue.TIMESTAMP
      }))
      .catch(error => showError("位置の送信", error));
  }, delay);
}

function moveBy(dx, dy) {
  if (!joined || !currentUser) return;

  const me = players[currentUser.uid];
  if (!me) {
    setStatus("自分の参加データを待っています。", "error");
    return;
  }

  const pos = clampPosition(
    safeNumber(me.x, 100) + dx,
    safeNumber(me.y, 100) + dy
  );

  // 自分の画面はすぐに動かし、その後Firebaseに送信
  players[currentUser.uid] = { ...me, x: pos.x, y: pos.y };
  drawRoom();
  queuePositionWrite();
}

function renderPlayers() {
  const list = $("playersList");
  list.replaceChildren();

  const entries = Object.entries(players);
  for (const [uid, player] of entries) {
    const li = document.createElement("li");
    const name = document.createElement("span");
    name.textContent = (player && player.name) ? player.name : "名前なし";
    name.style.fontWeight = uid === (currentUser && currentUser.uid) ? "700" : "400";

    const dot = document.createElement("span");
    dot.textContent = "● ";
    dot.style.color = player && player.color ? player.color : "#64748b";

    li.append(dot, name);
    if (uid === (currentUser && currentUser.uid)) {
      const you = document.createElement("span");
      you.textContent = "（自分）";
      you.className = "small";
      li.append(you);
    }
    list.appendChild(li);
  }

  if (entries.length === 0) {
    const li = document.createElement("li");
    li.textContent = "参加者はいません。";
    list.appendChild(li);
  }
}

function drawRoom() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 背景の床グリッド
  ctx.fillStyle = "#f8fafc";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = "#e5eaf1";
  ctx.lineWidth = 1;
  for (let x = 0; x <= canvas.width; x += 40) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, canvas.height);
    ctx.stroke();
  }
  for (let y = 0; y <= canvas.height; y += 40) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(canvas.width, y);
    ctx.stroke();
  }

  // 机
  for (const [x, y] of [[120,120],[280,120],[440,120],[600,120],
                         [120,340],[280,340],[440,340],[600,340]]) {
    ctx.fillStyle = "#d9e3ee";
    ctx.fillRect(x - 42, y - 22, 84, 44);
    ctx.strokeStyle = "#aebdce";
    ctx.strokeRect(x - 42, y - 22, 84, 44);
  }

  for (const [uid, player] of Object.entries(players)) {
    if (!player) continue;
    const x = safeNumber(player.x, 100);
    const y = safeNumber(player.y, 100);
    const color = player.color || "#2563eb";

    ctx.beginPath();
    ctx.arc(x, y, 15, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.lineWidth = uid === (currentUser && currentUser.uid) ? 4 : 2;
    ctx.strokeStyle = uid === (currentUser && currentUser.uid) ? "#172554" : "#ffffff";
    ctx.stroke();

    ctx.font = "14px Arial, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "top";
    const label = String(player.name || "名前なし").slice(0, 20);
    const width = ctx.measureText(label).width + 12;
    ctx.fillStyle = "rgba(255,255,255,0.94)";
    ctx.fillRect(x - width / 2, y + 19, width, 22);
    ctx.fillStyle = "#243247";
    ctx.fillText(label, x, y + 23);
  }
}

canvas.addEventListener("click", event => {
  if (!joined || !currentUser) return;

  const rect = canvas.getBoundingClientRect();
  const x = (event.clientX - rect.left) * canvas.width / rect.width;
  const y = (event.clientY - rect.top) * canvas.height / rect.height;

  const me = players[currentUser.uid];
  if (!me) return;

  const pos = clampPosition(x, y);
  players[currentUser.uid] = { ...me, x: pos.x, y: pos.y };
  drawRoom();
  queuePositionWrite();
});

document.addEventListener("keydown", event => {
  if (!joined) return;
  if (["INPUT", "TEXTAREA"].includes(document.activeElement.tagName)) return;

  const step = event.shiftKey ? 20 : 8;
  let dx = 0, dy = 0;

  if (event.key === "ArrowUp" || event.key.toLowerCase() === "w") dy = -step;
  else if (event.key === "ArrowDown" || event.key.toLowerCase() === "s") dy = step;
  else if (event.key === "ArrowLeft" || event.key.toLowerCase() === "a") dx = -step;
  else if (event.key === "ArrowRight" || event.key.toLowerCase() === "d") dx = step;
  else return;

  event.preventDefault();
  moveBy(dx, dy);
});

$("upButton").addEventListener("click", () => moveBy(0, -20));
$("downButton").addEventListener("click", () => moveBy(0, 20));
$("leftButton").addEventListener("click", () => moveBy(-20, 0));
$("rightButton").addEventListener("click", () => moveBy(20, 0));

async function leaveRoom() {
  if (!joined && !currentUser) return;

  joined = false;
  if (writeTimer) {
    clearTimeout(writeTimer);
    writeTimer = null;
  }

  try {
    if (playersRef && playersCallback) {
      playersRef.off("value", playersCallback);
    }
    if (connectedRef && connectedCallback) {
      connectedRef.off("value", connectedCallback);
    }
    if (myPlayerRef) {
      await myPlayerRef.onDisconnect().cancel();
      await myPlayerRef.remove();
    }
  } catch (error) {
    console.error("退室処理:", error);
  }

  players = {};
  currentUser = null;
  myPlayerRef = null;
  playersRef = null;
  connectedRef = null;
  playersCallback = null;
  connectedCallback = null;

  appScreen.style.display = "none";
  loginScreen.style.display = "block";
  $("leaveButton").style.display = "none";
  loginButton.disabled = false;
  setLoginMessage("退室しました。再入室できます。");
}

loginButton.addEventListener("click", joinRoom);
$("nameInput").addEventListener("keydown", event => {
  if (event.key === "Enter") joinRoom();
});
$("leaveButton").addEventListener("click", leaveRoom);

window.addEventListener("beforeunload", () => {
  // 通常のタブ終了時はFirebaseのonDisconnectが削除を担当
  if (writeTimer) clearTimeout(writeTimer);
});

drawRoom();
</script>
</body>
</html>
